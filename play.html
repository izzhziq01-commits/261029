<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lift off! — Balloons</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="minigame.css">
</head>
<body class="play-page">
  <header class="game-header"><a class="back-link" href="choose.html">← Choose again</a><span class="wordmark">LIFTOFF</span></header>
  <div class="round-clock" id="round-clock" role="timer" aria-label="30 seconds remaining">
    <span class="clock-caption" aria-hidden="true">TIME LEFT</span>
    <span id="timer" aria-hidden="true">
      <span class="flip-digit" id="timer-tens" data-value="3"><span class="flip-leaf">3</span><span class="digit-seam"></span></span>
      <span class="flip-digit" id="timer-ones" data-value="0"><span class="flip-leaf">0</span><span class="digit-seam"></span></span>
    </span>
    <span class="clock-unit" aria-hidden="true">SECONDS</span>
  </div>
  <main class="game-stage" id="game-stage">
    <div class="ground-scene" aria-hidden="true"></div>
    <div class="game-instructions"><h1 id="mission-title">Lift off</h1><p class="hold-prompt" id="hold-prompt">Hold anywhere to inflate</p></div>
    <div id="lift-object" class="lift-object"></div>
    <div class="ground-shadow" id="ground-shadow"></div>
  </main>
  <canvas id="game-canvas" aria-hidden="true"></canvas>
  <div id="bird-warning" class="bird-warning" role="status" hidden>Bird approaching — click it to protect your balloons!</div>
  <button id="bird-deflect" class="bird-deflect" type="button" aria-label="Chase away the bird" hidden></button>
  <div class="timing-meter" id="timing-meter" aria-label="Release inside the green arc" hidden>
    <svg class="timing-ring" viewBox="0 0 64 64" aria-hidden="true">
      <circle class="ring-track" cx="32" cy="32" r="26"/>
      <circle class="ring-pressure" id="meter-pressure" cx="32" cy="32" r="26" transform="rotate(-90 32 32)"/>
      <circle class="ring-zone" id="meter-zone" cx="32" cy="32" r="26" transform="rotate(-90 32 32)"/>
      <g id="meter-needle"><line x1="32" y1="32" x2="32" y2="9"/><circle cx="32" cy="9" r="2"/></g>
      <circle class="ring-center" cx="32" cy="32" r="8"/>
    </svg>
    <strong id="timing-hint">HOLD</strong>
  </div>
  <footer class="game-controls" aria-label="Flight controls">
    <button class="hud-icon" id="restart" type="button" aria-label="Restart flight" title="Restart flight">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 1 1 1.3 6.4M4 4v6h6"/></svg>
    </button>
    <div class="progress-panel">
      <div class="progress-copy"><span id="lift-percent">0%</span></div>
      <progress id="lift-progress" value="0" max="12" aria-label="Lift progress"></progress>
    </div>
    <button class="hud-icon" id="sound-toggle" type="button" aria-label="Turn sound off" aria-pressed="true" title="Turn sound off">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M11 5 6 9H3v6h3l5 4Z"/>
        <g class="audio-waves"><path d="M15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></g>
        <g class="audio-muted"><path d="m16 9 5 6m0-6-5 6"/></g>
      </svg>
    </button>
  </footer>
  <dialog id="result-dialog"><h2 id="result-title"></h2><p id="result-description"></p><p class="next-challenge-copy" id="next-challenge-copy" hidden></p><a class="next-challenge" id="next-challenge" hidden></a><button class="pill" id="play-again">Play again</button><a href="choose.html">Choose another object →</a></dialog>
  <script src="missions.js"></script>
  <script src="modes.js"></script>
  <script src="game.js"></script>
  <script src="minigame.js"></script>
</body>
</html>
